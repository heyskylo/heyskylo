name: Build postmarketOS ROM

# Builds the postmarketOS Phone ROM (pmos/) — the Nyxian slot host image plus
# manifest — and uploads rom.zip. Two jobs mirror the Linux ROM's split:
#
#   guest-images (ubuntu):  drift-checks the pinned postmarketOS image against
#                           the official .sha256 sidecar on every build (a few
#                           KiB), and optionally downloads+verifies+decompresses
#                           the full 1.4 GiB artifact via workflow_dispatch.
#   build (macOS):          compiles the host (`main`, Objective-C + the
#                           vendored XZ decoder), validates the manifest, and
#                           packages rom.zip.
#
# The engine (libqemu-x86_64-softmmu.dylib from utmapp/qemu v10.0.12-utm, built
# the way Husk does it) is NOT built here yet — that is the engine milestone.
# The host dlopens it at runtime inside the slot, so this CI stays green while
# it lands.

on:
  push:
    paths:
      - 'pmos/**'
      - '.github/workflows/build-pmos.yml'
  pull_request:
    paths:
      - 'pmos/**'
      - '.github/workflows/build-pmos.yml'
  workflow_dispatch:
    inputs:
      full-image-check:
        description: 'Also download + decompress the full guest image (ubuntu runner)'
        required: false
        default: false
        type: boolean

jobs:
  guest-images:
    name: Verify pinned guest image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install xz (full check only)
        run: sudo apt-get update && sudo apt-get install -y xz-utils
      - name: Drift check against official sidecar
        run: bash pmos/scripts/prepare-guest-images.sh --verify-only
      - name: Full stage + hash report
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.full-image-check == 'true'
        run: bash pmos/scripts/prepare-guest-images.sh
      - name: Summarize
        run: |
          echo "## Guest image pin" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256 in \`pmos/guest-images.lock.tsv\` matches the official .sha256 sidecar." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build ROM (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          # macOS runners already have a configured developer dir; only switch
          # when the toolchain is genuinely missing, and never with an unexpanded
          # glob (which makes xcode-select fail with "invalid argument").
          if ! xcodebuild -version >/dev/null 2>&1; then
            set -e
            XCODE_APP=$(ls -d /Applications/Xcode*.app 2>/dev/null | head -n 1)
            if [ -z "$XCODE_APP" ]; then
              echo "no Xcode bundle found under /Applications" >&2
              exit 1
            fi
            sudo xcode-select -s "$XCODE_APP"
          fi
          xcodebuild -version
      - name: Validate manifest
        run: make -C pmos validate
      - name: Build host + package rom.zip
        run: make -C pmos rom.zip
      - name: Inspect package
        run: |
          unzip -l pmos/rom.zip
          test -n "$(unzip -l pmos/rom.zip | grep 'ROM/main')"
          test -n "$(unzip -l pmos/rom.zip | grep 'ROM/manifest.plist')"
          test -n "$(unzip -l pmos/rom.zip | grep 'ROM/assets/bootlogo.png')"
      - name: Upload rom.zip
        uses: actions/upload-artifact@v4
        with:
          name: pmos-rom
          path: pmos/rom.zip